# example: a daily host summary. Copy to ~/.pi/agent/jobs/example.conf, and example.md beside it.
# The gather step is plain shell; its stdout is the only data the model sees, so the job is
# read-only by construction (pi-job runs pi with --no-tools).
GATHER='echo "## uptime"; uptime; echo; echo "## disk"; df -h -x tmpfs -x devtmpfs; echo; echo "## failed user units"; systemctl --user --failed --no-legend --no-pager || true'
PROMPT="example.md"
# MODEL / HEALTH default to PI_JOB_MODEL / PI_JOB_HEALTH; set them here to pin this job.
# MODEL="my-provider/my-model"
# HEALTH="http://127.0.0.1:8080/health"
